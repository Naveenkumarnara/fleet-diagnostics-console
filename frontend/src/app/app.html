<div class="shell">
  <header class="top-bar" role="banner">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1" y="10" width="16" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M17 13h3.5l2 3V18h-5.5v-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="5.5" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="14.5" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="20.5" cy="18" r="2" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Fleet Console</span>
        <span class="brand-sub">Diagnostics &amp; Health</span>
      </div>
    </div>

    <nav aria-label="Main navigation">
      <a routerLink="/events"  routerLinkActive="active" aria-label="Event log view">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h12v2H2zm0 4h8v2H2zm0 4h10v2H2z"/></svg>
        Event Log
      </a>
      <a routerLink="/summary" routerLinkActive="active" aria-label="Dashboard summary view">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1 9h4v6H1zm5-5h4v11H6zm5-3h4v14h-4z"/></svg>
        Dashboard
      </a>
    </nav>

    <div class="header-right">
      <div class="live-badge" title="Live telemetry stream active" aria-label="Live telemetry stream active">
        <span class="live-dot"></span>
        <span class="live-label">LIVE</span>
      </div>

      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [title]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <!-- sun icon shown in dark mode (click → light) -->
        <svg *ngIf="theme.theme() === 'dark'" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 1v2M10 17v2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M1 10h2M17 10h2M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <!-- moon icon shown in light mode (click → dark) -->
        <svg *ngIf="theme.theme() === 'light'" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M16 11.5A6.5 6.5 0 018.5 4a6.5 6.5 0 106.9 9.3 5.9 5.9 0 01.6-1.8z"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <app-search-panel></app-search-panel>

  <app-live-banner
    *ngIf="showLiveBanner$ | async"
    [count]="(fleet.pendingLiveCount$ | async) ?? 0"
    (apply)="fleet.applyLiveUpdates()"
  ></app-live-banner>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
