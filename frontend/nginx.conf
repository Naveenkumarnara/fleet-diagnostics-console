server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend traffic through /api so the frontend stays same-origin.
    location /api/ {
        proxy_pass              http://backend:3000/api/;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        Connection '';
        # Long timeout so SSE connections aren't silently killed by nginx
        # after the default 60s. Normal API requests finish well under this.
        proxy_read_timeout      3600s;
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding on;
    }

    # Angular routing — send all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
